    .update-indicator {
  position: relative;
  width: 12px;
  height: 12px;
  background-color: #00c853;
  border-radius: 50%;
  box-shadow: 0 0 4px rgba(0, 200, 83, 0.5);
  animation: shine-pulse 4s ease-in-out infinite;
}

.update-indicator::before,
.update-indicator::after {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  width: 12px;
  height: 12px;
  background-color: rgba(0, 200, 83, 0.3);
  border-radius: 50%;
  transform: translate(-50%, -50%) scale(1);
  opacity: 0;
  pointer-events: none;
}

.update-indicator::before {
  animation: concentric-ring 4s ease-out infinite;
}

.update-indicator::after {
  animation: concentric-ring 4s ease-out infinite 2s; /* offset for alternating rings */
}

@keyframes shine-pulse {
  0%, 100% {
    box-shadow: 0 0 4px rgba(0, 200, 83, 0.4);
  }
  50% {
    box-shadow: 0 0 10px rgba(0, 200, 83, 0.8);
  }
}

@keyframes concentric-ring {
  0% {
    transform: translate(-50%, -50%) scale(1);
    opacity: 0.5;
  }
  100% {
    transform: translate(-50%, -50%) scale(3);
    opacity: 0;
  }
}

function formatLastMessageTime(timestamp) {
  // Convert "2025-07-29 02:15 PM" to a Date object
  const parts = timestamp.match(/^(\d{4})-(\d{2})-(\d{2}) (\d{1,2}):(\d{2}) (\w{2})$/);
  if (!parts) return timestamp; // fallback if format is unexpected

  const [_, year, month, day, hourStr, minuteStr, ampm] = parts;
  let hour = parseInt(hourStr, 10);
  const minute = parseInt(minuteStr, 10);

  // Convert to 24-hour format
  if (ampm.toUpperCase() === "PM" && hour !== 12) hour += 12;
  if (ampm.toUpperCase() === "AM" && hour === 12) hour = 0;

  const msgDate = new Date(+year, month - 1, +day, hour, minute);
  const now = new Date();

  const isSameDay = (d1, d2) =>
    d1.getFullYear() === d2.getFullYear() &&
    d1.getMonth() === d2.getMonth() &&
    d1.getDate() === d2.getDate();

  const yesterday = new Date(now);
  yesterday.setDate(now.getDate() - 1);

  if (isSameDay(msgDate, now)) {
    // Return time in 12-hour format with AM/PM
    return msgDate.toLocaleTimeString([], {
      hour: 'numeric',
      minute: '2-digit',
      hour12: true
    });
  } else if (isSameDay(msgDate, yesterday)) {
    return "Yesterday";
  } else {
    return msgDate.toISOString().split('T')[0]; // YYYY-MM-DD
  }
}
  
  
  
  
  function getCurrentTimestamp() {
  const now = new Date();

  const year = now.getFullYear();
  const month = String(now.getMonth() + 1).padStart(2, '0'); // months are 0-based
  const day = String(now.getDate()).padStart(2, '0');

  let hour = now.getHours();
  const minute = String(now.getMinutes()).padStart(2, '0');
  const ampm = hour >= 12 ? 'PM' : 'AM';

  hour = hour % 12;
  hour = hour ? hour : 12; // 0 becomes 12

  return `${year}-${month}-${day} ${String(hour).padStart(2, '0')}:${minute} ${ampm}`;
}
