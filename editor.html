<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Modular Code Editor Overlay</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.14/lib/codemirror.css">
  <style>
    .mod-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 20px rgba(0,0,0,0.2);
    }

    .mod-header {
      display: flex;
      align-items: center;
      padding: 8px 12px;
      background: rgba(0,0,0,0.6);
      color: white;
    }
    .mod-close {
      background: #e74c3c;
      color: white;
      border: none;
      padding: 4px 10px;
      margin-right: 10px;
      border-radius: 4px;
      cursor: pointer;
    }
    .mod-user-pic {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      margin-right: 10px;
    }
    .mod-user-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 150px;
    }

    .mod-tabs {
      display: flex;
      background: rgba(0, 0, 0, 0.3);
    }
    .mod-tab-btn {
      flex: 1;
      padding: 8px;
      text-align: center;
      cursor: pointer;
      color: white;
      background: transparent;
      border-bottom: 2px solid transparent;
    }
    .mod-tab-btn.active {
      border-bottom: 2px solid #00aced;
    }

    .mod-tab-content {
      flex: 1;
      display: none;
      overflow: hidden;
    }
    .mod-tab-content.active {
      display: block;
    }

    .mod-footer {
      background: rgba(255, 255, 255, 0.2);
      padding: 8px 12px;
    }

    .mod-arrow {
      font-size: 24px;
      cursor: pointer;
    }

    .CodeMirror {
      height: 100%;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    @media (max-width: 600px) {
      .mod-user-name {
        max-width: 100px;
        font-size: 14px;
      }
      .mod-tab-btn {
        font-size: 12px;
      }
    }
  </style>
</head>
<body>

<div class="mod-overlay" id="mod-editor">
  <div class="mod-header">
    <button class="mod-close" onclick="document.getElementById('mod-editor').remove()">×</button>
    <img class="mod-user-pic" src="https://via.placeholder.com/28" />
    <div class="mod-user-name" title="User Name Here">User Name Here</div>
  </div>

  <div class="mod-tabs">
    <div class="mod-tab-btn active" data-tab="editor">Editor</div>
    <div class="mod-tab-btn" data-tab="output">Output</div>
  </div>

  <div class="mod-tab-content active" id="mod-editor-tab">
    <textarea id="mod-textarea"><!DOCTYPE html>
<html>
<head><title>Hello</title></head>
<body><h1>Hello World</h1></body>
</html></textarea>
  </div>

  <div class="mod-tab-content" id="mod-output-tab">
    <iframe id="mod-output-iframe"></iframe>
  </div>

  <div class="mod-footer">
    <div class="mod-arrow">↑</div>
  </div>
</div>

<!-- CodeMirror & Dependencies -->
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.14/lib/codemirror.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.14/mode/xml/xml.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.14/mode/javascript/javascript.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.14/mode/css/css.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.14/mode/htmlmixed/htmlmixed.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.14/addon/edit/closetag.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.14/addon/edit/matchtags.js"></script>

<script>
  window.onload = function () {
    const editor = CodeMirror.fromTextArea(document.getElementById('mod-textarea'), {
      lineNumbers: true,
      mode: 'htmlmixed',
      theme: 'default',
      autoCloseTags: true,
     // matchTags: { bothTags: true }
    });

    // Tabs switching
    const buttons = document.querySelectorAll('.mod-tab-btn');
    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        buttons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        document.querySelectorAll('.mod-tab-content').forEach(tab => tab.classList.remove('active'));

        if (btn.dataset.tab === 'editor') {
          document.getElementById('mod-editor-tab').classList.add('active');
        } else {
          document.getElementById('mod-output-tab').classList.add('active');
          document.getElementById('mod-output-iframe').srcdoc = editor.getValue();
        }
      });
    });
  };
</script>
</body>
</html>
