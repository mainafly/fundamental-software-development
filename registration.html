    }

    body {

  :empty#status {

    .card {
      background: white;
      border-radius: 1rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      max-width: 700px;
      width: 100%;
      overflow: hidden;
      padding: 2rem;
    }

    .top {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .top img {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 1rem;
      //border: 4px solid var(--primary);
    }

    .upload-img {
      margin-bottom: 1rem;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group label {
      font-weight: bold;
      margin-bottom: 0.4rem;
    }

    .form-group input,
    .form-group select {
      padding: 0.5rem;
      border: 1px solid var(--border);
      border-radius: 0.4rem;
      font-size: 1rem;
    }

    .submit-btn {
      margin-top: 1.5rem;
      text-align: center;
    }

    .submit-btn button {
      background-color: var(--primary);
      color: white;
      padding: 0.75rem 2rem;
      font-size: 1rem;
      border: none;
      border-radius: 0.5rem;
      cursor: pointer;
    }

    @media (max-width: 600px) {
      .card {
        padding: 1.5rem;
      }
    }
  
  
  
.loader {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: white;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  backdrop-filter: blur(6px);
  background-color: rgba(255, 255, 255, 0.5);
}

.ripple {
  position: relative;
  width: 80px;
  height: 80px;
}

.ripple::before,
.ripple::after {
  content: "";
  position: absolute;
  inset: 0;
  border: 4px solid #007bff;
  border-radius: 50%;
  animation: rippleAnim 1.5s infinite;
}

.ripple::after {
  animation-delay: 0.75s;
}

@keyframes rippleAnim {
  0% {
    transform: scale(0.5);
    opacity: 1;
  }
  100% {
    transform: scale(2);
    opacity: 0;
  }
}
  </style>

  async function uploadFile() {
      const fileInput = document.getElementById("profilePicInput");
      const file = fileInput.files[0];

      if (!file) {
        let status = document.getElementById("status");
        clearTimeout(timeoutId);
        status.innerText="Please upload your passport.";
        timeoutId = setTimeout(_=>status.innerText = "", 2000);        
        return 0;
      }

      const cloudName = "daktkkz2k"; // Replace with your Cloudinary cloud name
      const uploadPreset = "passport"; // Replace with your unsigned preset

      const formData = new FormData();
      formData.append("file", file);
      formData.append("upload_preset", uploadPreset);

      const status = document.getElementById("status");
      status.innerText = "Uploading...";

      try {
        const response = await fetch(`https://api.cloudinary.com/v1_1/${cloudName}/upload`, {
          method: "POST",
          body: formData
        });

        const data = await response.json();
        console.log("Uploaded file:", data);
        clearTimeout(timeoutId);
        status.innerText = "Upload successful!";

        status.innerText = "Upload failed.";
       timeoutId = setTimeout(_=>status.innerText = "", 2000);
        return 1; //error
      }
