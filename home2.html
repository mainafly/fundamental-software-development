<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User List | CoCode</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link href="styles/loader.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.14/lib/codemirror.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: #f5f8fa;
      color: #333;
      padding: 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #3f51b5;
      color: #fff;
      padding: 15px 20px;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 9900;
      min-height: 80px;
    }

    .container {
      max-width: 800px;
      margin: 100px auto 0 auto;
    }

    .user-card {
      display: flex;
      align-items: center;
      background: white;
      border-radius: 12px;
      padding: 15px 20px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      transition: transform 0.2s ease;
    }

    .user-card:hover {
      transform: scale(1.01);
    }

    .user-pic {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      object-fit: cover;
      margin-right: 15px;
    }

    .user-info {
      flex-grow: 1;
    }

    .user-name {
      font-weight: 600;
      font-size: 1.1em;
      text-transform: capitalize;
    }

    .last-msg {
      font-size: 0.9em;
      color: #666;
    }

    .badge {
      background: #ff4757;
      color: white;
      font-size: 0.8em;
      padding: 4px 8px;
      border-radius: 999px;
      min-width: 24px;
      text-align: center;
    }

    .menu-container {
      position: absolute;
      right: 0;
      top: 0;
      z-index: 110;
      transform: scaleX(0);
      background-color: #333;
      color: #fff;
      padding: 20px;
      width: 220px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.6);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      transition: transform 0.2s ease-out;
    }

    .menu-container.show {
      transform: scaleX(1);
    }

    .menu-container button#close {
      background: transparent;
      color: #ffffff;
      border: none;
      font-size: 18px;
      float: right;
      cursor: pointer;
    }

    .menu-container ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .menu-container li {
      margin: 12px 0;
    }

    .menu-container a {
      color: #80cbc4;
      text-decoration: none;
      font-weight: bold;
      transition: color 0.3s ease;
    }

    .menu-container a:hover {
      color: #4db6ac;
    }

    .mod-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      z-index: 9999;
      display: none;
      flex-direction: column;
    }

    .mod-header {
      display: flex;
      align-items: center;
      padding: 8px 12px;
      background: rgba(0, 0, 0, 0.6);
      color: white;
    }

    .mod-close {
      color: white;
      border: none;
      padding: 4px 10px;
      margin-right: 10px;
      border-radius: 4px;
      cursor: pointer;
    }

    .mod-user-pic {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      margin-right: 10px;
    }

    .mod-user-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 150px;
    }

    .mod-tabs {
      display: flex;
      background: rgba(0, 0, 0, 0.3);
    }

    .mod-tab-btn {
      flex: 1;
      padding: 8px;
      text-align: center;
      cursor: pointer;
      color: white;
      background: transparent;
      border-bottom: 2px solid transparent;
    }

    .mod-tab-btn.active {
      border-bottom: 2px solid #00aced;
    }

    .mod-tab-content {
      flex: 1;
      display: none;
      overflow: hidden;
    }

    .mod-tab-content.active {
      display: block;
    }

    .mod-footer {
      background: rgba(255, 255, 255, 0.2);
      padding: 8px 12px;
    }

    .mod-arrow {
      font-size: 24px;
      cursor: pointer;
    }

    .CodeMirror {
      height: 100%;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    button {
      padding: 10px 20px;
      background-color: #4caf50;
      border: none;
      color: white;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.3s ease;
    }

    button:hover {
      background-color: #388e3c;
    }

    @media (max-width: 600px) {
      .user-card {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
      }

      .badge {
        align-self: flex-end;
      }

      .mod-user-name {
        max-width: 100px;
        font-size: 14px;
      }

      .mod-tab-btn {
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>CoCode Users</h1>
    <button onclick="logout()">Logout</button>
  </header>

  <div class="container" id="userList">
    <!-- User cards will be dynamically injected here -->
  </div>

  <!-- Optional: Loading indicator -->
  <div id="loader" style="display:none;text-align:center;padding:20px;">
    <p>Loading users...</p>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js"></script>

  <script>
    // Firebase config
const firebaseConfig = {
    apiKey: "AIzaSyBzebDzvgcldMRjilheYQNbpTQu7KHpdq8",
    authDomain: "codechat-ac099.firebaseapp.com",
    projectId: "codechat-ac099",
    storageBucket: "codechat-ac099.firebasestorage.app",
    messagingSenderId: "56113632061",
    appId: "1:56113632061:web:783ff26002958398b42b54",
    measurementId: "G-XJ5SQB87QR"
  };

    const app = firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const userList = document.getElementById('userList');
    const loader = document.getElementById('loader');

    function renderUser(user) {
      const card = document.createElement('div');
      card.className = 'user-card';

      const pic = document.createElement('img');
      pic.src = user.photoURL || 'https://via.placeholder.com/50';
      pic.alt = 'User';
      pic.className = 'user-pic';

      const info = document.createElement('div');
      info.className = 'user-info';

      const name = document.createElement('div');
      name.className = 'user-name';
      name.textContent = user.name || 'Unnamed User';

      const email = document.createElement('div');
      email.className = 'last-msg';
      email.textContent = user.email || '';

      info.appendChild(name);
      info.appendChild(email);

      card.appendChild(pic);
      card.appendChild(info);

      userList.appendChild(card);
    }

    function fetchUsers() {
      loader.style.display = 'block';
      db.collection('users').get().then(snapshot => {
        loader.style.display = 'none';
        snapshot.forEach(doc => {
          renderUser(doc.data());
        });
      }).catch(err => {
        loader.style.display = 'none';
        console.error('Error fetching users:', err);
      });
    }

    function logout() {
      auth.signOut().then(() => {
        window.location.href = 'signin.html';
      });
    }

    // Ensure user is logged in
    auth.onAuthStateChanged(user => {
      if (!user) {
        window.location.href = 'signin.html';
      } else {
        fetchUsers();
      }
    });
  </script>
</body>

</html>
